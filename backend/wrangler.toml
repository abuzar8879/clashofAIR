name = "exam-platform-api"
main = "src/index.js"
compatibility_date = "2024-01-15"
compatibility_flags = ["nodejs_compat"]

[vars]
FRONTEND_URL = "https://exam-platform.pages.dev"
JWT_SECRET = "local-secret-key-12345"
# GOOGLE_CLIENT_ID should be set via `wrangler secret put`

[[d1_databases]]
binding = "DB"
database_name = "exam-platform-db"
database_id = "8f3e2b1a-4c5d-6e7f-8a9b-0c1d2e3f4a5b" # Placeholder ID, user should update if deploying to prod

[dev]
port = 8787
local_protocol = "http"
